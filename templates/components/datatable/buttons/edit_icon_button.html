<a

    title="Actualizar"
    hx-get="{{ url }}"
    hx-target="#modal_content"
    hx-trigger="click"
    hx-swap="innerHTML"
    data-bs-toggle="modal"
    data-bs-target="#modal_htmx">

    <span class="visually-hidden">
        Editar
    </span>
</a>
