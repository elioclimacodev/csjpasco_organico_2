{% load static navigation_tags %}
{% get_sidebar as sidebar %}
{% if sidebar %}
<aside class="navbar navbar-vertical navbar-expand-lg sidebar-institucional" data-bs-theme="dark">
    <div class="container-fluid">
        <!-- Inicio Botón de menú (pantallas pequeñas) -->
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#sidebar-menu"
            aria-controls="sidebar-menu"
            aria-expanded="false"
            aria-label="Mostrar u ocultar el menú de navegación">
            <span class="navbar-toggler-icon"></span>
        </button>
        <!-- Fin Botón de menú -->

        {% include 'components/navigation/aside/_logo.html' %}

        {% include 'components/navigation/aside/_menu.html' %}

        {% include 'components/navigation/aside/_user.html' %}
    </div>
</aside>
{% endif %}
