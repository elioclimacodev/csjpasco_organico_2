<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
<div class="modal-status bg-success"></div>
<div class="modal-body text-center py-4">
    <!-- Download SVG icon from http://tabler.io/icons/icon/circle-check -->
    
    {% block modal_icon %}
        <svg 
            xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon mb-2 text-green icon-lg">
            <path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"></path>
            <path d="M9 12l2 2l4 -4"></path>
        </svg>
    {% endblock modal_icon %}
        
    <h3>
        {% block modal_title %}
            ¿Está seguro que desea eliminar?
        {% endblock modal_title %}
    </h3>
    <div class="text-secondary">
        {% block modal_content %}
            Do you really want to remove 84 files? What you've done cannot be undone.
        {% endblock modal_content %}
    </div>
</div>
<div class="modal-footer">
    <div class="w-100">
        <div class="row">
            <div class="col">
                <a href="#" class="btn btn-3 w-100" data-bs-dismiss="modal"> Go to dashboard </a>
            </div>
            <div class="col">
                <a href="#" class="btn btn-success btn-4 w-100" data-bs-dismiss="modal"> View invoice </a>
            </div>
        </div>
    </div>
</div>
