<div class="modal-header">
    <h5 class="modal-title text-truncate">
        {{ modal_title|default:'Contenido modal'}}
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
{% block modal_content %}
    <div id="modal-body" class="modal-body">
        <!-- Formulario modal -->
        {% block modal_body %}
        {% endblock modal_body %}
    </div>
    <div class="modal-footer">
        <!-- Botones del modal -->
        {% block modal_buttons %}
            <div class="me-auto d-none d-md-block"></div>

            <!-- Botón móvil (full width) -->
            <button 
                type="button" 
                class="btn btn-5 d-md-none w-100"
                data-bs-dismiss="modal">
                Cerrar
            </button>

            <!-- Contenedor para desktop -->
            <div class="d-none d-md-flex ms-auto">
                <!-- ms-auto empuja este bloque a la derecha -->
                <button 
                    type="button" 
                    class="btn btn-5"
                    data-bs-dismiss="modal">
                    Cerrar
                </button>
            </div>
        {% endblock modal_buttons %}
    </div>
{% endblock modal_content %}
