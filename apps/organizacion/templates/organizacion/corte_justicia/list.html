{% extends 'layouts/base_list.html' %}


{% block page_header_actions %}
    {% if is_empty_database %}
        <button 
            type="button"
            class="btn btn-primary d-none d-sm-inline-block"
            hx-get="{% url 'organizacion:corte_create' distrito_judicial.pk %}"
            hx-trigger="click"
            hx-target="#modal_content"
            hx-swap="innerHTML"
            data-bs-toggle="modal"
            data-bs-target="#modal_htmx">
            <!-- https://tabler.io/icons?icon=plus -->
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-plus"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M12 5l0 14" /><path d="M5 12l14 0" /></svg>
            Nueva Corte
        </button>        
    {% endif %}
{% endblock page_header_actions %}
    

{% block datatable %}
    {% include 'organizacion/corte_justicia/partials/_datatable.html' %}
{% endblock datatable %}
